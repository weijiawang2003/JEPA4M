[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa4m-portfolio"
version = "0.1.0"
description = "Predictive representation learning with exact environments and verified symbolic search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=7.4,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
